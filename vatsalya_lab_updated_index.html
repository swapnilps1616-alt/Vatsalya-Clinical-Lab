<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="वात्सल्य लॅब">
<title>वात्सल्य क्लिनिकल लॅब</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Devanagari",sans-serif;background:#f4f7fb;margin:0;color:#172033}
header{background:#1565c0;color:#fff;padding:24px 18px;text-align:center}
header h1{margin:0;font-size:29px} header div{font-size:18px;margin-top:8px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;position:sticky;top:0;z-index:5}
nav button{min-width:max-content}
button{border:0;border-radius:12px;padding:13px 18px;background:#1565c0;color:#fff;font-size:16px}
button.secondary{background:#475467}.whatsapp{background:#128c7e}.danger{background:#b42318}
.card{background:#fff;margin:14px 12px;padding:18px;border-radius:20px;box-shadow:0 2px 14px #00000012}
input,select{width:100%;padding:14px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:12px;font-size:17px;background:#fff}
.hidden{display:none}.muted{color:#667085}.success{color:#087f23}
.item{background:#fff;margin:12px 0;padding:16px;border-radius:16px;box-shadow:0 2px 12px #00000010}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
.report{max-width:850px;margin:auto;border:1px solid #ddd;padding:22px;background:#fff}
.report-head{text-align:center;border-bottom:2px solid #1565c0;padding-bottom:12px}
.report-head h2{margin:0;font-size:26px}.report-head p{margin:5px}
.report-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px;margin:15px 0}
.report table th{background:#eef5ff}
@media(max-width:600px){.report-meta{grid-template-columns:1fr}header h1{font-size:27px}}
@media print{
body{background:#fff}header,nav,.no-print{display:none!important}
.card{box-shadow:none;margin:0;padding:0}.report{border:0;box-shadow:none}
}
</style>
</head>
<body>

<header>
<h1>वात्सल्य क्लिनिकल लॅब</h1>
<div>अभोणा चौफुली, अभोणा • मो. ८८५६९९२९३८</div>
</header>

<nav>
<button onclick="show('home')">Dashboard</button>
<button onclick="show('patients')">Patients</button>
<button onclick="show('results')">Results</button>
<button onclick="show('billing')">Billing</button>
<button onclick="show('report')">Report</button>
<button onclick="backup()">Backup</button>
</nav>

<section id="home" class="card">
<h2>Offline Dashboard</h2>
<p id="stats"></p>
<p class="muted">हे software iPhone वर offline वापरण्यासाठी तयार आहे. डेटा या browser मध्ये स्थानिकरित्या साठवला जातो.</p>
</section>

<section id="patients" class="card hidden">
<h2>Patient Registration</h2>
<input id="pn" placeholder="Patient Name *">
<input id="pa" type="number" placeholder="Age">
<select id="pg"><option>Male</option><option>Female</option><option>Other</option></select>
<input id="pm" inputmode="tel" placeholder="Mobile">
<input id="pd" placeholder="Doctor">
<button onclick="savePatient()">Save Patient</button>
<h3>Patient Search</h3>
<input id="ps" placeholder="Name / Mobile / ID" oninput="renderPatients()">
<div id="plist"></div>
</section>

<section id="results" class="card hidden">
<h2>Test / Result Entry</h2>
<input id="rid" type="number" placeholder="Patient ID">
<input id="rt" placeholder="Test Name">
<input id="rr" placeholder="Result">
<input id="ru" placeholder="Unit">
<input id="rf" placeholder="Reference Range">
<button onclick="saveResult()">Save Result</button>
<div id="rlist"></div>
</section>

<section id="billing" class="card hidden">
<h2>Billing</h2>
<input id="bid" type="number" placeholder="Patient ID">
<input id="ba" type="number" placeholder="Total Amount ₹">
<input id="bp" type="number" placeholder="Paid ₹">
<button onclick="saveBill()">Save Bill</button>
<div id="blist"></div>
</section>

<section id="report" class="card hidden">
<h2>Report Preview</h2>
<input id="repid" type="number" placeholder="Patient ID">
<div class="row no-print">
<button onclick="makeReport()">Generate Report</button>
<button class="secondary" onclick="clearReport()">Clear</button>
</div>
<div id="reportbox"></div>
</section>

<script>
const key='vatsalya_lab_v2';
let db=JSON.parse(localStorage.getItem(key)||'{"patients":[],"results":[],"bills":[]}');

function save(){localStorage.setItem(key,JSON.stringify(db));update()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function show(id){
 document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden'); update();
 if(id==='patients')renderPatients();
 if(id==='results')renderResults();
 if(id==='billing')renderBills();
}
function update(){
 document.getElementById('stats').textContent=`Patients: ${db.patients.length} • Results: ${db.results.length} • Bills: ${db.bills.length}`;
}
function savePatient(){
 let n=pn.value.trim(); if(!n)return alert('Patient name required');
 let id=db.patients.length?Math.max(...db.patients.map(x=>x.id))+1:1;
 db.patients.push({id,name:n,age:pa.value,gender:pg.value,mobile:pm.value,doctor:pd.value,date:new Date().toLocaleString('en-IN')});
 save(); alert('Patient saved. ID: '+id);
 pn.value=pa.value=pm.value=pd.value=''; renderPatients();
}
function renderPatients(){
 let q=(ps.value||'').toLowerCase();
 let a=db.patients.filter(x=>String(x.id).includes(q)||x.name.toLowerCase().includes(q)||String(x.mobile||'').includes(q));
 plist.innerHTML=a.map(x=>`<div class="item"><b>ID ${x.id} — ${esc(x.name)}</b><br>Age: ${esc(x.age)} | ${esc(x.gender)}<br>Mobile: ${esc(x.mobile)}<br>Doctor: ${esc(x.doctor||'-')}</div>`).join('')||'<p class="muted">No patients found</p>';
}
function saveResult(){
 let id=+rid.value;
 if(!db.patients.find(x=>x.id===id))return alert('Patient ID not found');
 if(!rt.value.trim()||!rr.value.trim())return alert('Test Name आणि Result भरा');
 db.results.push({id,test:rt.value.trim(),result:rr.value.trim(),unit:ru.value.trim(),ref:rf.value.trim(),date:new Date().toLocaleString('en-IN')});
 save(); alert('Result saved'); rt.value=rr.value=ru.value=rf.value=''; renderResults();
}
function renderResults(){
 rlist.innerHTML=db.results.slice().reverse().map(x=>`<div class="item"><b>Patient ID ${x.id}</b><br>${esc(x.test)}: <b>${esc(x.result)}</b> ${esc(x.unit)}<br><span class="muted">Ref: ${esc(x.ref)}</span></div>`).join('')||'<p class="muted">No results</p>';
}
function saveBill(){
 let id=+bid.value,a=+ba.value,p=+bp.value;
 if(!db.patients.find(x=>x.id===id))return alert('Patient ID not found');
 if(a<0||p<0||p>a)return alert('Paid amount योग्य भरा');
 db.bills.push({id,amount:a,paid:p,due:a-p,date:new Date().toLocaleString('en-IN')});
 save(); alert('Bill saved'); bid.value=ba.value=bp.value=''; renderBills();
}
function renderBills(){
 blist.innerHTML=db.bills.slice().reverse().map(x=>`<div class="item"><b>Patient ID ${x.id}</b><br>Total ₹${x.amount} • Paid ₹${x.paid} • Due ₹${x.due}</div>`).join('')||'<p class="muted">No bills</p>';
}
function makeReport(){
 let id=+repid.value,p=db.patients.find(x=>x.id===id);
 if(!p)return alert('Patient ID not found');
 let rs=db.results.filter(x=>x.id===id);
 let bills=db.bills.filter(x=>x.id===id);
 let total=bills.reduce((s,x)=>s+x.amount,0),paid=bills.reduce((s,x)=>s+x.paid,0),due=total-paid;
 reportbox.innerHTML=`
 <div class="report" id="printReport">
  <div class="report-head">
   <h2>वात्सल्य क्लिनिकल लॅब</h2>
   <p>अभोणा चौफुली, अभोणा</p><p>मो. ८८५६९९२९३८</p>
   <p><b>LABORATORY TEST REPORT</b></p>
  </div>
  <div class="report-meta">
   <div><b>Patient ID:</b> ${p.id}</div><div><b>Date:</b> ${esc(new Date().toLocaleDateString('en-IN'))}</div>
   <div><b>Name:</b> ${esc(p.name)}</div><div><b>Age:</b> ${esc(p.age)}</div>
   <div><b>Gender:</b> ${esc(p.gender)}</div><div><b>Mobile:</b> ${esc(p.mobile)}</div>
   <div><b>Doctor:</b> ${esc(p.doctor||'-')}</div>
  </div>
  <table>
   <tr><th>Test</th><th>Result</th><th>Unit</th><th>Reference Range</th></tr>
   ${rs.length?rs.map(x=>`<tr><td>${esc(x.test)}</td><td><b>${esc(x.result)}</b></td><td>${esc(x.unit)}</td><td>${esc(x.ref)}</td></tr>`).join(''):'<tr><td colspan="4">No test results</td></tr>'}
  </table>
  <br>
  ${bills.length?`<table><tr><th colspan="2">Billing Summary</th></tr><tr><td>Total</td><td>₹${total}</td></tr><tr><td>Paid</td><td>₹${paid}</td></tr><tr><td>Due</td><td>₹${due}</td></tr></table>`:''}
  <br><br>
  <div style="display:flex;justify-content:space-between">
   <span>Patient / Receiver</span><span>Authorized Signatory</span>
  </div>
  <div class="no-print row" style="margin-top:25px">
   <button onclick="window.print()">Print / Save PDF</button>
   <button class="whatsapp" onclick="shareWhatsApp(${p.id})">WhatsApp Share</button>
  </div>
 </div>`;
}
function shareWhatsApp(id){
 let p=db.patients.find(x=>x.id===id),rs=db.results.filter(x=>x.id===id);
 if(!p)return;
 let text=`वात्सल्य क्लिनिकल लॅब%0APatient ID: ${p.id}%0AName: ${p.name}%0A`+
 rs.map(x=>`${x.test}: ${x.result} ${x.unit} (Ref: ${x.ref})`).join('%0A')+
 `%0A%0AReport तयार आहे.`;
 window.open('https://wa.me/?text='+encodeURIComponent(decodeURIComponent(text)),'_blank');
}
function clearReport(){reportbox.innerHTML=''}
function backup(){
 let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vatsalya_lab_backup.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
update();
</script>
</body>
</html>
